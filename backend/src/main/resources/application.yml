server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
  tomcat:
    max-swallow-size: 12MB
spring:
  application:
    name: roadsaathi-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/roadsaathi}
    username: ${DATABASE_USERNAME:roadsaathi}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 12
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp:
      connectiontimeout: 5000
      timeout: 5000
      auth: ${MAIL_AUTH:false}
      starttls.enable: ${MAIL_TLS:false}
management:
  health.mail.enabled: ${MAIL_ENABLED:false}
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: never
  endpoint.health.probes.enabled: true
springdoc:
  swagger-ui.path: /swagger-ui.html
roadsaathi:
  jwt-secret: ${JWT_SECRET:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  cookie-secure: ${COOKIE_SECURE:true}
  demo-seed: ${DEMO_SEED:false}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:no-reply@roadsaathi.example}
  openai-api-key: ${OPENAI_API_KEY:}
  openai-model: ${OPENAI_VISION_MODEL:gpt-4.1-mini}
  storage-path: ${STORAGE_PATH:.data/evidence}
  storage-mode: ${STORAGE_MODE:local}
  storage-endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  storage-bucket: ${STORAGE_BUCKET:roadsaathi}
  storage-access-key: ${STORAGE_ACCESS_KEY:}
  storage-secret-key: ${STORAGE_SECRET_KEY:}
